<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Large format vinyl graphic</title>
<desc id="desc">Illustration of a self-adhesive large format vinyl graphic with a peeled corner.</desc>
<rect width="800" height="600" fill="#f8f5ec"/>
<rect width="800" height="170" fill="#2E90E6"/>
<circle cx="112" cy="82" r="66" fill="#ffffff" opacity=".18"/>
<text x="56" y="76" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">AY PRINT</text>
<text x="56" y="122" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="600">SELF-ADHESIVE VINYL</text>
<g transform="translate(80 215)">
<rect x="0" y="30" width="640" height="220" rx="10" fill="#dceaf6"/>
<rect x="0" y="30" width="640" height="220" rx="10" fill="#ffffff" opacity=".32"/>
<rect x="30" y="60" width="190" height="54" rx="8" fill="#1b3a5b"/>
<rect x="244" y="60" width="190" height="54" rx="8" fill="#C9A227"/>
<rect x="458" y="60" width="150" height="54" rx="8" fill="#2E90E6"/>
<rect x="30" y="142" width="578" height="62" rx="8" fill="#f2e6c6"/>
<path d="M585 30 L640 82 L585 82 Z" fill="#ffffff" stroke="#b8c7d6" stroke-width="3"/>
<path d="M585 30 L640 82" stroke="#6d7f91" stroke-width="4"/>
</g>
<text x="56" y="535" fill="#1b3a5b" font-family="Arial, sans-serif" font-size="22" font-weight="600">Self-adhesive / gloss or matte / site graphics</text>
</svg>