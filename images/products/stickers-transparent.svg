<title id="title">Transparent vinyl stickers</title>
<desc id="desc">Illustration of clear vinyl stickers applied to a glass-like surface.</desc>
<rect width="800" height="600" fill="#eef4fb"/>
<rect width="800" height="170" fill="#2E90E6"/>
<circle cx="112" cy="82" r="66" fill="#ffffff" opacity=".18"/>
<text x="56" y="76" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">AY PRINT</text>
<text x="56" y="122" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="600">CLEAR VINYL STICKERS</text>
<g transform="translate(185 210)">
<rect x="0" y="20" width="430" height="280" rx="16" fill="#dceaf6" opacity=".72"/>
<rect x="28" y="48" width="374" height="224" rx="12" fill="#ffffff" opacity=".24" stroke="#ffffff" stroke-width="3"/>
<circle cx="142" cy="142" r="72" fill="#ffffff" opacity=".72" stroke="#2E90E6" stroke-width="5"/>
<rect x="245" y="94" width="130" height="96" rx="20" fill="#ffffff" opacity=".72" stroke="#C9A227" stroke-width="5"/>
